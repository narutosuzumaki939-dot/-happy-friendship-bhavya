<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day 💛</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#ffd6e7,#fff0a8,#dff9fb,#ffe5ec);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{

width:90%;
max-width:430px;

background:rgba(255,255,255,.28);
backdrop-filter:blur(18px);

padding:35px;

border-radius:28px;

text-align:center;

box-shadow:0 18px 40px rgba(0,0,0,.18);

animation:pop .8s ease;

position:relative;

z-index:2;

}

@keyframes pop{

from{
transform:scale(.6);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

h1{

font-size:34px;
color:#ff4f88;
margin-bottom:10px;

}

.name{

font-size:24px;
font-weight:700;
margin-bottom:18px;
color:#555;

}

p{

font-size:18px;
line-height:1.8;
color:#444;
margin-bottom:25px;

}

button{

padding:14px 30px;

font-size:18px;

border:none;

border-radius:50px;

background:#ff4f88;

color:white;

cursor:pointer;

transition:.35s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 20px #ff4f88;

}

#msg{

display:none;

margin-top:28px;

font-size:17px;

line-height:1.9;

color:#444;

animation:fade .7s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.heart{

position:absolute;

font-size:22px;

animation:float 8s linear infinite;

opacity:.6;

}

@keyframes float{

0%{
transform:translateY(110vh);
}

100%{
transform:translateY(-120vh);
}

}.right-heart{
left:15%;
animation-delay:1s;
}

.left-heart{
right:18%;
animation-delay:3s;
}

.small{
font-size:16px;
}

.big{
font-size:34px;
}

</style>
</head>

<body>

<div class="heart big" style="left:8%">💛</div>
<div class="heart small" style="left:25%">✨</div>
<div class="heart" style="left:40%">🤍</div>
<div class="heart big" style="left:62%">💖</div>
<div class="heart small" style="left:82%">⭐</div>

<div class="card">

<h1>💛 Happy Friendship Day 💛</h1>

<div class="name">
Bhavyaa 🤭
</div>

<p>
Dear <b>Bhondu</b>,<br><br>

Aaj socha kuch different karte hain... 😌<br>

Isliye ye chhota sa surprise sirf tumhare liye. 💛<br><br>

Ready...? 👀
</p>

<button onclick="showMsg()">
Open Surprise 🎁
</button>

<div id="msg"></div>

</div>

<script>

function showMsg(){

const msg=document.getElementById("msg");

msg.style.display="block";

msg.innerHTML=`

<h2 style="color:#ff4f88;">
💛 Happy Friendship Day Bhavyaa 💛
</h2>

<p>

Heyyy <b>Battery 🔋</b> 🤭,<br><br>

Aaj Friendship Day hai...
toh officially bol hi deta hu. 💛

<br><br>

Thank you for being meri <b>HG</b>. 🤝

Meri bakwaas sunne ke liye...

Mujhe <b>Owl 🦉</b> bolne ke liye...

Aur har baar <b>Sticker Chor 😂</b> kehke roast karne ke liye.

<br><br>

Sach bolu...

Life thodi aur funny ho gayi hai
jabse ek <b>Bhondu</b> meri dost bani. 😭😂

<br><br>

Aur haan...

Battery 🔋...Apni battery hamesha full charge rakhna... 😌⚡

Aur Bhondu rehna mat chhodna,
warna pehchaan kaise aayegi? 😂💛

<br><br>

Thank you for all the random conversations,
stupid jokes, teasing,
aur woh chhoti chhoti memories
jo hamesha yaad rahengi. 🫶

<br><br>

<b>
Happy Friendship Day,
Bhondu! 🤝💛
</b>

<br><br>

— From your HB 🦉❤️

<br>

<i>
(Owl • Sticker Chor • Certified Dost 😂)
</i>

<div style="font-size:35px;margin-top:15px;">
🎉💛✨🫶🌸
</div>

`;

for(let i=0;i<30;i++){

const heart=document.createElement("div");

heart.innerHTML=["💛","💖","✨","🤍","🌸"][Math.floor(Math.random()*5)];

heart.style.position="fixed";

heart.style.left=Math.random()*100+"vw";

heart.style.top="-20px";

heart.style.fontSize=(18+Math.random()*25)+"px";

heart.style.animation=`fall ${4+Math.random()*4}s linear forwards`;

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

}

}

const style=document.createElement("style");

style.innerHTML=`
@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}
`;

document.head.appendChild(style);

</script>

</body>
</html>
